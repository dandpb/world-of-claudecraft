#:schema https://developers.openai.com/codex/config-schema.json

# This project config makes canonical repository guidance discoverable, bounds native
# parallelism, and sets the shared model baseline for Codex sessions. Permissions, auth,
# and provider account choices stay at the user or session layer.
project_doc_fallback_filenames = ["CLAUDE.md"]
project_doc_max_bytes = 65536

model = "gpt-5.6-sol"
model_context_window = 372000
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"

[agents]
max_depth = 1

[features.multi_agent_v2]
max_concurrent_threads_per_session = 16
